# Pré-processamento (schema 2.0). enabled: false pula a etapa.

schema_version: "2.0"

stages:
  select_columns:
    enabled: true
  adult_filter:
    enabled: true
    min_age: 18
  derive_features:
    enabled: true
  merge_internacao_into_servico:
    enabled: true
  one_hot_and_numeric:
    enabled: true
  impute_missing:
    enabled: true
    binary: 0
    categorical: -1
  impute_age_by_target:
    enabled: false
  nearmiss:
    enabled: false
    version: 1
  target_encoding_before_split:
    enabled: false

weights:
  legacy_formula: false

derived:
  imc:
    enabled: true
  faixas_idade:
    enabled: true
  grupos_comorbidade:
    enabled: true

classification_features:
  target_column: "Serviço de Saúde"
  weight_column: "Peso Amostral"
  exclude_columns:
    - "Serviço de Saúde"
    - "Peso Amostral"
    - Cluster
    - survey_weight
    - ml_sample_weight
  target_encode_columns:
    - Zona
    - Sexo
    - Raça
    - "Estado Civil"
    - Cluster
