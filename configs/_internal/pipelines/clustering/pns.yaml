# Pipeline de agrupamento (schema 2.0) — template com defaults TCC.

schema_version: "2.0"
enabled: true
backend: sklearn
device: cpu

source_base: pns

reducer:
  name: pca
  enabled: true
  n_components: 8
  apply_scaler: true
  scaler_type: standard

estimator:
  name: kmeans
  enabled: true
  n_clusters: 6
  selection_method: fixed
  init: k-means++
  n_init: 50
  max_iter: 1000
  elbow_n_init: 10
  elbow_max_k: 15
  random_state: 42

pipeline:
  - id: load_preprocessing
    enabled: true
  - id: select_features
    enabled: true
  - id: pca_reducer
    enabled: true
    params: { n_components: 8, apply_scaler: true, scaler_type: standard }
  - id: elbow_selection
    enabled: false
  - id: kmeans_estimator
    enabled: true
    params: { name: kmeans, n_clusters: 6, selection_method: fixed }
  - id: attach_cluster_labels
    enabled: true
  - id: evaluate_metrics
    enabled: true
  - id: finalize_outputs
    enabled: true
