# Pré-processamento rigoroso (schema 3.0) — mitigações PRE-* da auditoria metodológica.

schema_version: "3.0"

binary_encoding:
  policy: explicit_missing
  missing_value: -1
  yes_value: "Sim"

emit_missing_audit: true

target:
  primary_column: servico_composto
  columns:
    servico_j014:
      source: "Serviço de Saúde"
      merge_internacao: false
    servico_composto:
      source: "Serviço de Saúde"
      merge_internacao: true

weights:
  legacy_formula: false

derived:
  imc:
    enabled: true
  faixas_idade:
    enabled: true
  grupos_comorbidade:
    enabled: true

pipeline:
  - id: select_columns
    enabled: true
  - id: adult_filter
    enabled: true
    params: { min_age: 18, require_imc_inputs: true }
  - id: encode_binary
    enabled: true
  - id: gestational_reinforce
    enabled: true
    params: { impute_age_by_target: false }
  - id: attach_weights
    enabled: true
  - id: drop_design_columns
    enabled: true
  - id: derive_binary
    enabled: true
    params: { one_hot: true }
  - id: encode_categorical
    enabled: true
    params: { one_hot: true }
  - id: build_targets
    enabled: true
  - id: missing_audit
    enabled: true
  - id: impute_missing
    enabled: true
    params: { binary: -1, categorical: -1 }
  - id: finalize_outputs
    enabled: true

# Compatibilidade: toggles usados pela classificação legada (não são estágios do pipeline)
stages:
  merge_internacao_into_servico:
    enabled: false
  nearmiss:
    enabled: false
    version: 1
  target_encoding_before_split:
    enabled: false

classification_features:
  target_column: servico_composto
  weight_column: "Peso Amostral"
  exclude_columns:
    - "Serviço de Saúde"
    - servico_j014
    - servico_composto
    - Internação
    - "Peso Amostral"
    - Cluster
    - survey_weight
    - ml_sample_weight
  target_encode_columns:
    - Zona
    - Sexo
    - Raça
    - "Estado Civil"
