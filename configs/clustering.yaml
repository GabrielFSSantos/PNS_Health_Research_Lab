# Configuração padrão do módulo de agrupamento (schema 1.0).
# Sobrescreva campos no YAML do experimento quando necessário.

schema_version: "1.0"
enabled: true
backend: sklearn
device: cpu

reducer:
  name: pca
  enabled: true
  n_components: 8
  apply_scaler: true
  scaler_type: standard

estimator:
  name: kmeans
  enabled: true
  n_clusters: 6
  selection_method: fixed
  init: k-means++
  n_init: 50
  max_iter: 1000
  elbow_n_init: 10
  elbow_max_k: 15
  random_state: 42
