# Metadados das variáveis da PNS 2019 usadas no TCC (pré-one-hot).
# Perguntas curadas a partir do fluxo legado (notebook de pré-processamento).

schema_version: "1.0"

variables:
  Sexo:
    code: C006
    question: "Qual o sexo do entrevistado?"
    used_in_study: true
    value_labels:
      Homem: "Homem"
      Mulher: "Mulher"

  Idade:
    code: C008
    question: "Qual a idade do entrevistado (em anos completos)?"
    used_in_study: true
    value_labels: {}

  Raça:
    code: C009
    question: "Qual a cor ou raça do entrevistado?"
    used_in_study: true
    value_labels:
      Branca: "Branca"
      Preta: "Preta"
      Parda: "Parda"
      Amarela: "Amarela"
      Indígena: "Indígena"

  "Estado Civil":
    code: C011
    question: "Qual o estado civil do entrevistado?"
    used_in_study: true
    value_labels:
      "Casado(a)": "Casado(a)"
      "Solteiro(a)": "Solteiro(a)"
      "Viúvo(a)": "Viúvo(a)"
      "Divorciado(a) ou desquitado(a) ou separado(a) judicialmente": "Divorciado/separado"

  Zona:
    code: V0026
    question: "A situação de moradia do domicílio é urbana ou rural?"
    used_in_study: true
    value_labels:
      Urbano: "Urbano"
      Rural: "Rural"

  "Grau de Ensino":
    code: VDD004A
    question: "Qual o grau de instrução mais elevado que frequentou?"
    used_in_study: true
    value_labels:
      "Sem Instrução": "Sem instrução"
      "EF Incompleto": "Fundamental incompleto"
      "EF Completo": "Fundamental completo"
      "EM Incompleto": "Médio incompleto"
      "EM Completo": "Médio completo"
      "SP Incompleto": "Superior incompleto"
      "SP Completo": "Superior completo"

  Renda:
    code: VDF004
    question: "Qual a renda domiciliar per capita (faixas de salário mínimo)?"
    used_in_study: true
    value_labels: {}

  "Cadastro UBS":
    code: B001
    question: "Está cadastrado em alguma Unidade Básica de Saúde?"
    used_in_study: true
    value_labels:
      Sim: "Sim"
      Não: "Não"

  "Agente Comunitário":
    code: B003
    question: "Recebe visita de agente comunitário de saúde?"
    used_in_study: true
    value_labels:
      Sim: "Sim"
      Não: "Não"
      "Nunca recebeu": "Nunca recebeu"

  "Estado de Saúde":
    code: J001
    question: "Em geral, como avalia a própria saúde?"
    used_in_study: true
    value_labels:
      "Muito bom": "Muito bom"
      Bom: "Bom"
      Regular: "Regular"
      Ruim: "Ruim"
      "Muito ruim": "Muito ruim"

  "Serviço de Saúde":
    code: J014
    question: "Nos últimos 12 meses, consultou médico ou outro profissional de saúde?"
    used_in_study: true
    value_labels:
      Sim: "Sim — utilizou serviço"
      Não: "Não — não utilizou"

  Internação:
    code: J037
