[project]
name = "pns-health-research-lab"
version = "0.2.0"
description = "Plataforma científica reproduzível para pesquisa com dados da PNS — uso de serviços de saúde"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "psutil>=5.9",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
acquisition = ["rpy2>=3.5"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dashboard = ["streamlit>=1.36,<2.0", "plotly>=5.18"]
gpu = [
    "cuml-cu12>=24.10; platform_system=='Linux'",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
pns-health = "pns_health_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pns_health_research"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/pns_health_research/dashboard/**" = ["E501"]
"src/pns_health_research/core/types.py" = ["UP040"]

[tool.mypy]
python_version = "3.12"
strict = false
packages = ["pns_health_research"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not regression and not regression_smoke'"
markers = [
    "regression: E2E PNS real (lento)",
    "regression_smoke: valida artefatos materializados (rápido)",
    "gpu: testes que exigem extra [gpu] (cuML/CUDA)",
]
