[project]
name = "pns-health-research"
version = "0.1.0"
description = "Reproducible experimental platform for PNS 2019 health service usage research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "psutil>=5.9",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
acquisition = ["rpy2>=3.5"]
mca = ["prince>=0.13"]
lpa = ["stepmix>=2.7"]
gpu = [
    "cuml-cu12>=24.10; platform_system=='Linux'",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
pns-research = "pns_health_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pns_health_research"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/pns_health_research/core/types.py" = ["UP040"]

[tool.mypy]
python_version = "3.12"
strict = false
packages = ["pns_health_research"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gpu: testes que exigem extra [gpu] (cuML/CUDA)",
]
