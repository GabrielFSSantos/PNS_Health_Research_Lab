schema_version: '2.0'
enabled: true
backend: sklearn
device: cpu
source_base: legacy
pipeline:
- id: load_preprocessing
  enabled: true
  params: {}
- id: select_features
  enabled: true
  params: {}
- id: pca_reducer
  enabled: true
  params:
    n_components: 8
    apply_scaler: false
    scaler_type: none
- id: elbow_selection
  enabled: false
  params: {}
- id: kmeans_estimator
  enabled: true
  params:
    name: kmeans
    n_clusters: 6
    selection_method: fixed
    n_init: 50
- id: attach_cluster_labels
  enabled: true
  params: {}
- id: evaluate_metrics
  enabled: true
  params: {}
- id: finalize_outputs
  enabled: true
  params: {}
comorbidity_columns: []
reducer:
  name: pca
  enabled: true
  n_components: 8
  apply_scaler: false
  scaler_type: none
estimator:
  name: kmeans
  enabled: true
  n_clusters: 6
  selection_method: fixed
  init: k-means++
  n_init: 50
  max_iter: 1000
  elbow_n_init: 10
  elbow_max_k: 15
  random_state: 42
